name: Build FrameGen LeviPack

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android arm64-v8a (.levipack)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android NDK r26b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake (Android arm64-v8a)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build libjngsframegen.so
        run: cmake --build build --target framegen --parallel --verbose

      - name: Strip and package FrameGen.levipack
        run: |
          "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded build/libjngsframegen.so
          python3 scripts/package_levipack.py \
            --library build/libjngsframegen.so \
            --icon assets/icon.png \
            --output FrameGen.levipack
          python3 scripts/verify_levipack.py FrameGen.levipack

      - name: Upload FrameGen.levipack
        uses: actions/upload-artifact@v4
        with:
          name: FrameGen-levipack-arm64-v8a
          path: |
            FrameGen.levipack
            build/libjngsframegen.so
          if-no-files-found: error
